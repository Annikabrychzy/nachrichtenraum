<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video-Raum</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;background:#13051d;font-family:Arial;color:#fff}#info{position:fixed;z-index:5;top:20px;left:22px;letter-spacing:.12em;font-size:11px;line-height:1.6;pointer-events:none;text-shadow:0 1px 8px #000}#info b{font-size:19px}#start{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#7a3c8f99,#120419 70%);text-align:center}#start div{padding:32px;border:1px solid #ffe6ff99;background:#1d0926dd}#start h1{letter-spacing:.15em;font-weight:500}button{padding:13px 23px;border:0;background:#fff0ff;color:#24062d;font-weight:bold;cursor:pointer;letter-spacing:.08em}#back{position:fixed;z-index:6;right:20px;bottom:20px}</style></head>
<body><section id="start"><div><h1>ANDERER RAUM</h1><p>Videos, Reels, Kochclips und Hundevideos finden dich.</p><button id="start-button">STARTEN</button></div></section><div id="info">ZWEITER RAUM<br><b>VIDEOS FINDEN DICH</b><br>HUNDE · KOCHVIDEOS · MEMES · REELS</div><button id="back" onclick="location.href='exit-test.html'">STARTEN</button><a-scene background="color:#160520" renderer="antialias:true;colorManagement:true"><a-assets><video id="dog" autoplay loop muted playsinline crossorigin="anonymous" src="https://archive.org/download/JamesNReynoldsStrayDog2005Apr16/straydogapr_01_512kb.mp4"></video><video id="cat" autoplay loop muted playsinline crossorigin="anonymous" src="https://mail.openbeelden.nl/files/11/60/1160774.1160771.Cat_5.mp4"></video><video id="cooking" autoplay loop muted playsinline crossorigin="anonymous" src="https://commons.wikimedia.org/wiki/Special:FilePath/Cooking%20Chicken%20and%20Rice.webm"></video><video id="meme" autoplay loop muted playsinline crossorigin="anonymous" src="https://cdn.aframe.io/videos/bunny.mp4"></video></a-assets><a-entity position="0 1.65 0"><a-camera look-controls wasd-controls><a-entity cursor="rayOrigin:mouse" raycaster="objects:.clip" position="0 0 -1" geometry="primitive:ring;radiusInner:.01;radiusOuter:.018" material="color:#fff;shader:flat"></a-entity></a-camera><a-entity oculus-touch-controls="hand:left" laser-controls="hand:left" cursor="rayOrigin:entity;fuse:false" raycaster="objects:.clip" line="color:#ffe0ff"></a-entity><a-entity oculus-touch-controls="hand:right" laser-controls="hand:right" cursor="rayOrigin:entity;fuse:false" raycaster="objects:.clip" line="color:#ffe0ff"></a-entity></a-entity><a-light type="ambient" color="#9954b8" intensity=".65"></a-light><a-light type="point" color="#ff4eaa" intensity="1.4" distance="16" position="0 4 0"></a-light><a-sky color="#160520"></a-sky><a-plane rotation="-90 0 0" width="100" height="100" color="#321144" material="emissive:#2d0e3d;emissiveIntensity:.45"></a-plane><a-entity id="clips"></a-entity></a-scene><script>AFRAME.registerComponent('face-camera',{tick(){const c=document.querySelector('a-camera');if(!c)return;const p=c.object3D.getWorldPosition(new THREE.Vector3());p.y=this.el.object3D.position.y;this.el.object3D.lookAt(p)}});const labels=['HUNDEVIDEO · noch einmal','KOCHVIDEO · schnell & lecker','MEME · du musst lachen','REEL · nur noch eins','CLIP · empfohlen für dich','TREND · alle schauen das'];const colors=['#ff62ae','#8d77ff','#ffbd52','#54dccf','#ff7298','#78a8ff'],root=document.querySelector('#clips');function card(i){const a=i/20*Math.PI*2,r=4+i%4*1.25,e=document.createElement('a-entity'),p={x:Math.sin(a)*r,y:.7+(i%5)*.85,z:Math.cos(a)*r};e.setAttribute('position',p);e.setAttribute('face-camera','');e.classList.add('clip');e.setAttribute('animation__float',`property:position;to:${p.x} ${p.y+.34} ${p.z};dur:${1400+i%4*500};dir:alternate;loop:true;easing:easeInOutSine`);const frame=document.createElement('a-plane');frame.setAttribute('width','2.05');frame.setAttribute('height','1.48');frame.setAttribute('color',colors[i%colors.length]);frame.setAttribute('material','emissive:currentColor;emissiveIntensity:.45');e.append(frame);if(i%3===0){const v=document.createElement('a-video'),sources=['#dog','#cat','#cooking','#meme'];v.setAttribute('src',sources[Math.floor(i/3)%sources.length]);v.setAttribute('width','1.85');v.setAttribute('height','1.08');v.setAttribute('position','0 .11 .025');e.append(v)}const text=document.createElement('a-text');text.setAttribute('value',labels[i%labels.length]);text.setAttribute('position','-.78 -.55 .04');text.setAttribute('width','.92');text.setAttribute('color','#210927');text.setAttribute('wrap-count','25');e.append(text);e.addEventListener('click',()=>e.setAttribute('animation__zoom','property:scale;to:1.5 1.5 1.5;dur:180'));root.append(e)}document.querySelector('#start-button').addEventListener('click',()=>{document.querySelector('#start').style.display='none';for(let i=0;i<30;i++)setTimeout(()=>card(i),i*80)})</script></body></html>
