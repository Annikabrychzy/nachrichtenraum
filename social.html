<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anderer Feed</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;background:#08050e;color:#fff;font-family:Arial}#info{position:fixed;z-index:5;left:22px;top:20px;letter-spacing:.13em;font-size:11px;color:#f1c8ff;pointer-events:none}#info strong{display:block;font-size:18px;margin-top:6px}button{position:fixed;z-index:6;right:20px;bottom:20px;background:#f7dbff;color:#17031f;border:0;padding:12px 18px;font-weight:bold;cursor:pointer}</style></head>
<body><div id="info">ANDERER RAUM<strong>DER FEED FINDET DICH</strong>CLIPS · MEMES · HUNDEVIDEOS · EMPFOHLEN FÜR DICH</div><button onclick="location.href='index.html'">ZURÜCK ZUM NACHRICHTENRAUM</button>
<a-scene background="color:#08050e" renderer="antialias:true; colorManagement:true"><a-entity position="0 1.6 0"><a-camera look-controls wasd-controls><a-entity cursor="rayOrigin:mouse" raycaster="objects:.clip" position="0 0 -1" geometry="primitive:ring;radiusInner:.008;radiusOuter:.014" material="color:#fff;shader:flat"></a-entity></a-camera><a-entity laser-controls="hand:left" raycaster="objects:.clip" line="color:#ffd6ff"></a-entity><a-entity laser-controls="hand:right" raycaster="objects:.clip" line="color:#ffd6ff"></a-entity></a-entity><a-light type="ambient" color="#4a174f" intensity=".6"></a-light><a-sky color="#08050e"></a-sky><a-plane rotation="-90 0 0" width="100" height="100" color="#160d1c"></a-plane><a-entity id="clips"></a-entity></a-scene>
<script>AFRAME.registerComponent('face-camera',{tick(){const c=document.querySelector('a-camera');if(!c)return;const p=c.object3D.getWorldPosition(new THREE.Vector3());p.y=this.el.object3D.position.y;this.el.object3D.lookAt(p)}});const labels=['HUNDEVIDEO · nochmal ansehen','MEME · du musst das sehen','CLIP · empfohlen für dich','REEL · nur noch eins','VIDEO · perfekter Moment','TREND · alle reden darüber'];const root=document.querySelector('#clips');function add(){const a=Math.random()*Math.PI*2,r=3+Math.random()*7,e=document.createElement('a-entity'),p={x:Math.sin(a)*r,y:1+Math.random()*4,z:Math.cos(a)*r};e.setAttribute('position',p);e.setAttribute('face-camera','');e.classList.add('clip');const q=document.createElement('a-plane');q.setAttribute('width','2.1');q.setAttribute('height','1.3');q.setAttribute('color',['#ff65b7','#9570ff','#ffbf5b','#4fd6cf'][Math.floor(Math.random()*4)]);q.setAttribute('material','emissive:currentColor;emissiveIntensity:.35');e.append(q);const t=document.createElement('a-text');t.setAttribute('value',labels[Math.floor(Math.random()*labels.length)]);t.setAttribute('position','-.78 -.48 .03');t.setAttribute('width','1');t.setAttribute('color','#120915');t.setAttribute('wrap-count','22');e.append(t);e.addEventListener('click',()=>e.setAttribute('animation__zoom','property:scale;to:1.6 1.6 1.6;dur:250'));root.append(e);setTimeout(()=>e.remove(),7000)}setInterval(add,480);for(let i=0;i<16;i++)setTimeout(add,i*120)</script></body></html>
