<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Nachrichtenraum VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #07111f; color: #eef5ff; }
    #hud { position: fixed; z-index: 3; inset: 0 auto auto 0; width: min(390px, calc(100vw - 32px)); margin: 16px; padding: 18px; border: 1px solid #63c7ff55; border-radius: 18px; background: #07111fe8; box-shadow: 0 12px 45px #0008; backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 1.25rem; } p { margin: 8px 0 14px; color: #bbd4ed; line-height: 1.45; }
    form { display: flex; gap: 8px; } input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid #4b86b8; border-radius: 10px; background: #0d2035; color: inherit; }
    button { border: 0; border-radius: 10px; padding: 11px 14px; background: #38bdf8; color: #02121d; font-weight: 800; cursor: pointer; }
    #hint { margin: 11px 0 0; font-size: .78rem; color: #8aa8c7; } @media (max-width: 600px) { #hud { width: auto; right: 0; } }
  </style>
</head>
<body>
  <section id="hud" aria-label="Nachrichten schreiben">
    <h1>Nachrichtenraum VR</h1>
    <p>Willkommen im gemeinsamen Raum. Schreibe eine Nachricht oder setze die VR-Brille auf und wähle <em>Enter VR</em>.</p>
    <form id="message-form"><input id="message-input" maxlength="72" placeholder="Deine Nachricht …" aria-label="Deine Nachricht"><button>Senden</button></form>
    <p id="hint">Desktop: Maus ziehen zum Umschauen. VR: mit dem Headset betreten.</p>
  </section>
  <a-scene background="color: #07111f" vr-mode-ui="enabled: true" renderer="colorManagement: true">
    <a-assets><a-mixin id="panel" geometry="primitive: plane; width: 3.7; height: 1.05" material="color: #102b45; metalness: .22; roughness: .4" text="align: center; color: #e7f5ff; width: 3.25; wrapCount: 30; baseline: center"></a-mixin></a-assets>
    <a-entity position="0 1.6 4"><a-camera look-controls wasd-controls="acceleration: 24"></a-camera></a-entity>
    <a-light type="ambient" color="#87bce8" intensity="0.5"></a-light><a-light type="point" color="#38bdf8" intensity="2" distance="12" position="0 4 0"></a-light><a-light type="point" color="#a855f7" intensity="1.5" distance="10" position="-5 2 -3"></a-light>
    <a-sky color="#07111f"></a-sky><a-plane rotation="-90 0 0" width="30" height="30" color="#0a1b2d" material="metalness:.35; roughness:.65"></a-plane><a-cylinder position="0 0.05 0" radius="3.5" height=".1" color="#0d2a45" material="emissive:#06355e; emissiveIntensity:.55"></a-cylinder><a-torus position="0 3.8 0" rotation="90 0 0" radius="2.2" radius-tubular=".04" color="#38bdf8" material="emissive:#0ea5e9; emissiveIntensity:1"></a-torus>
    <a-entity position="0 2.8 -3.3"><a-text value="NACHRICHTENRAUM" align="center" width="7" color="#dff6ff"></a-text><a-text value="Verbinde dich. Teile Gedanken. Sei dabei." position="0 -.43 0" align="center" width="4" color="#7dd3fc"></a-text></a-entity>
    <a-entity id="messages"><a-entity mixin="panel" position="-2.2 1.8 -2.2" rotation="0 42 0" text="value: Hallo! Schön, dass du da bist.;"></a-entity><a-entity mixin="panel" position="2.2 2 -2.2" rotation="0 -42 0" text="value: Dieser Raum funktioniert auch in VR.;"></a-entity><a-entity mixin="panel" position="0 1.35 -4.3" text="value: Schreibe oben deine erste Nachricht.;"></a-entity></a-entity>
  </a-scene>
  <script>
    const form = document.querySelector('#message-form'), input = document.querySelector('#message-input'), messages = document.querySelector('#messages');
    const positions = ['-2.2 1.8 -2.2', '2.2 2 -2.2', '0 1.35 -4.3', '-3 1.3 -4.3', '3 1.35 -4.3', '0 2.65 -4.3']; let nextPosition = 0;
    form.addEventListener('submit', event => { event.preventDefault(); const value = input.value.trim(); if (!value) return; const panel = document.createElement('a-entity'); panel.setAttribute('mixin', 'panel'); panel.setAttribute('position', positions[nextPosition % positions.length]); panel.setAttribute('rotation', nextPosition % 2 ? '0 -28 0' : '0 28 0'); panel.setAttribute('text', 'value: ' + value + ';'); messages.append(panel); nextPosition++; input.value = ''; input.focus(); });
  </script>
</body>
</html>
