<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Unendlicher Feed — Nachrichtenraum</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; overflow: hidden; background: #000; color: #effaff; }
    #overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at center, #10192188, #000 66%); transition: opacity .8s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #start-panel { width: min(440px, calc(100vw - 48px)); padding: 31px; border: 1px solid #c9f2ff99; background: #05090dcc; box-shadow: 0 0 70px #7cdcff22; text-align: center; }
    h1 { margin: 0 0 9px; letter-spacing: .17em; font-size: clamp(25px, 5vw, 44px); font-weight: 500; }
    p { line-height: 1.55; color: #b8cbd5; }
    button { padding: 14px 26px; border: 1px solid #e5faff; background: #e5faff; color: #061017; font-weight: 700; letter-spacing: .12em; cursor: pointer; }
    #hud { position: fixed; z-index: 8; top: 21px; left: 23px; pointer-events: none; font-size: 10px; letter-spacing: .15em; color: #c2e2ef; text-shadow: 0 1px 5px #000; }
    #hud strong { display: block; margin: 5px 0; color: white; font-size: 18px; font-weight: 500; }
    #hud small { color: #8ea5b1; }
  </style>
</head>
<body>
  <section id="overlay">
    <div id="start-panel">
      <h1>UNENDLICHER FEED</h1>
      <p>Ein Raum für politische Informationsüberflutung. Drehe dich um, bewege dich mit dem linken Stick und schließe Meldungen mit dem Laserpointer.</p>
      <button id="start">RAUM BETRETEN</button>
      <p><small>WebXR / Meta Quest: Im Browser anschließend das VR-Symbol wählen.</small></p>
    </div>
  </section>
  <div id="hud">INFORMATIONSRAUM<strong id="phase">MORGEN · erste Meldungen</strong><small id="count">0 MELDUNGEN</small></div>

  <a-scene id="scene" renderer="antialias: true; colorManagement: true" background="color: #000000" vr-mode-ui="enabled: true" loading-screen="enabled: false">
    <a-entity id="rig" position="0 1.65 0" smooth-locomotion>
      <a-camera id="camera" look-controls wasd-controls="acceleration: 18">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .click-target" position="0 0 -1" geometry="primitive: ring; radiusInner: .008; radiusOuter: .014" material="color: #e3fbff; shader: flat"></a-entity>
      </a-camera>
      <a-entity id="left-hand" oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .click-target; far: 20" line="color: #bdeeff; opacity: .65"></a-entity>
      <a-entity id="right-hand" oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .click-target; far: 20" line="color: #bdeeff; opacity: .65"></a-entity>
    </a-entity>
    <a-light type="ambient" color="#0b1118" intensity="0.18"></a-light>
    <a-light id="flashlight" type="point" color="#ccefff" intensity="0" distance="10" decay="2" position="0 2 0"></a-light>
    <a-sky color="#000000"></a-sky>
    <a-plane rotation="-90 0 0" width="180" height="180" color="#030609" material="roughness: .98; metalness: .1"></a-plane>
    <a-entity id="news-grid"></a-entity>
    <a-entity id="escape-panel" visible="false" face-player>
      <a-plane width="4.7" height="2.15" color="#071016" material="emissive: #112c39; emissiveIntensity: .3"></a-plane>
      <a-text value="Möchtest du diesen Raum verlassen?" position="0 .47 .03" align="center" width="3.2" color="#f1fbff" wrap-count="32"></a-text>
      <a-text value="Der Nachrichtenstrom wird nicht von allein still." position="0 .06 .03" align="center" width="1.7" color="#9bb9c7" wrap-count="40"></a-text>
      <a-entity id="leave-room" class="click-target" position="-1.08 -.63 .04"><a-plane width="1.62" height=".48" color="#e5faff"></a-plane><a-text value="JA, GEHEN" position="0 -.08 .02" align="center" width=".72" color="#061017"></a-text></a-entity>
      <a-entity id="stay-room" class="click-target" position="1.08 -.63 .04"><a-plane width="1.62" height=".48" color="#19333f"></a-plane><a-text value="BLEIBEN" position="0 -.08 .02" align="center" width=".72" color="#e5faff"></a-text></a-entity>
    </a-entity>
  </a-scene>

  <script>
  /* A complete static WebXR scene: network feeds are optional; the exhibition works offline using FALLBACK_NEWS. */
  const FALLBACK_NEWS = [
    {source:'Tagesschau', title:'Haushaltsdebatte prägt die politische Woche', text:'Im Parlament wird weiter über Prioritäten, Investitionen und soziale Sicherung beraten.'},
    {source:'Tagesschau', title:'Europa sucht nach gemeinsamen Antworten', text:'Bei den Gesprächen stehen Sicherheit, Klima und wirtschaftliche Folgen im Mittelpunkt.'},
    {source:'SPIEGEL', title:'Neue Zahlen lösen politische Diskussionen aus', text:'Regierung und Opposition bewerten die aktuelle Entwicklung sehr unterschiedlich.'},
    {source:'SPIEGEL', title:'Kommunen fordern rasche Entlastung', text:'Städte und Gemeinden warnen vor wachsenden Belastungen in ihren Haushalten.'},
    {source:'taz', title:'Junge Stimmen verlangen mehr Beteiligung', text:'Initiativen diskutieren darüber, wie politische Teilhabe erreichbar bleibt.'},
    {source:'taz', title:'Klimapolitik zwischen Anspruch und Alltag', text:'Neue Entscheidungen treffen auf unterschiedliche Erwartungen in der Gesellschaft.'},
    {source:'Tagesschau', title:'Weitere Verhandlungen bis in die Nacht', text:'Eine Einigung gilt weiter als offen. Der Ticker wird fortlaufend aktualisiert.'},
    {source:'SPIEGEL', title:'Analyse: Was die Entscheidung bedeutet', text:'Die Auswirkungen reichen über die heutige Nachricht hinaus.'},
    {source:'taz', title:'Debatte um Wohnraum wird lauter', text:'Die Frage nach gerechter Verteilung bestimmt viele kommunale Diskussionen.'}
  ];
  const FEEDS = [
    {name:'Tagesschau', url:'https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml'},
    {name:'SPIEGEL', url:'https://www.spiegel.de/politik/index.rss'},
    {name:'taz', url:'https://taz.de/!p4608;rss/'}
  ];
  const grid = document.querySelector('#news-grid');
  const camera = document.querySelector('#camera');
  const light = document.querySelector('#flashlight');
  const phaseEl = document.querySelector('#phase');
  const countEl = document.querySelector('#count');
  const escapePanel = document.querySelector('#escape-panel');
  let news = [...FALLBACK_NEWS], started = false, startTime = 0, cardCount = 0, sequenceTimer, creatingInitial = false;

  AFRAME.registerComponent('smooth-locomotion', {
    schema: { speed: {default: 2.1} },
    init() { this.direction = new THREE.Vector3(); this.forward = new THREE.Vector3(); this.right = new THREE.Vector3(); },
    tick(_, dt) {
      const controllers = [document.querySelector('#left-hand'), document.querySelector('#right-hand')];
      let axes = null;
      for (const hand of controllers) {
        const tracked = hand && hand.components['tracked-controls'];
        const gamepad = tracked && tracked.controller && tracked.controller.gamepad;
        if (gamepad && gamepad.axes && gamepad.axes.length >= 2) { axes = gamepad.axes; break; }
      }
      if (!axes) return;
      const x = Math.abs(axes[0]) > .14 ? axes[0] : 0;
      const y = Math.abs(axes[1]) > .14 ? axes[1] : 0;
      if (!x && !y) return;
      camera.object3D.getWorldDirection(this.forward); this.forward.y = 0; this.forward.normalize();
      this.right.crossVectors(this.forward, new THREE.Vector3(0, 1, 0)).normalize();
      this.direction.copy(this.forward).multiplyScalar(-y).addScaledVector(this.right, x).normalize();
      this.el.object3D.position.addScaledVector(this.direction, this.data.speed * dt / 1000);
    }
  });
  AFRAME.registerComponent('face-player', {
    tick() { const p = camera.object3D.getWorldPosition(new THREE.Vector3()); p.y = this.el.object3D.position.y; this.el.object3D.lookAt(p); }
  });

  function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function short(s, n) { s = (s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function tone() {
    try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(360, a.currentTime); o.frequency.exponentialRampToValueAtTime(120, a.currentTime + .09); g.gain.setValueAtTime(.045, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .12); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .13); } catch (_) {}
  }
  function flash(position) { light.setAttribute('position', position); light.setAttribute('intensity', 2.3); setTimeout(() => light.setAttribute('intensity', 0), 120); }
  function sourceColor(source) { return source === 'Tagesschau' ? '#65d3ff' : source === 'SPIEGEL' ? '#ff808c' : '#f2bd58'; }
  function randomNews() { return news[Math.floor(Math.random() * news.length)]; }
  function makeCard(item, pos) {
    const entity = document.createElement('a-entity');
    entity.setAttribute('position', pos); entity.setAttribute('face-player', ''); entity.setAttribute('scale', '0.01 0.01 0.01');
    const panel = document.createElement('a-plane'); panel.setAttribute('width', '1.72'); panel.setAttribute('height', '1.12'); panel.setAttribute('color', '#eaf8ff'); panel.setAttribute('material', 'emissive: #badff0; emissiveIntensity: .42; roughness: .65'); entity.appendChild(panel);
    const stripe = document.createElement('a-plane'); stripe.setAttribute('width', '.045'); stripe.setAttribute('height', '1.12'); stripe.setAttribute('position', '-.835 0 .012'); stripe.setAttribute('color', sourceColor(item.source)); entity.appendChild(stripe);
    function label(value, position, width, color, align='left') { const el = document.createElement('a-text'); el.setAttribute('value', value); el.setAttribute('position', position); el.setAttribute('width', width); el.setAttribute('color', color); el.setAttribute('align', align); el.setAttribute('wrap-count', 28); entity.appendChild(el); }
    label(item.source.toUpperCase(), '-.68 .38 .025', .52, '#375160');
    label(short(item.title, 90), '-.68 .12 .025', .92, '#07131b');
    label(short(item.text, 120), '-.68 -.35 .025', .62, '#436371');
    const close = document.createElement('a-entity'); close.classList.add('click-target'); close.setAttribute('position', '.65 .38 .04');
    const closeBg = document.createElement('a-plane'); closeBg.setAttribute('width', '.25'); closeBg.setAttribute('height', '.25'); closeBg.setAttribute('color', '#0b1b24'); close.appendChild(closeBg);
    const x = document.createElement('a-text'); x.setAttribute('value', '×'); x.setAttribute('position', '0 -.075 .015'); x.setAttribute('align', 'center'); x.setAttribute('width', '.44'); x.setAttribute('color', '#ffffff'); close.appendChild(x);
    close.addEventListener('click', ev => { ev.stopPropagation(); entity.remove(); cardCount--; updateCount(); for (let i=0; i<3; i++) setTimeout(() => spawnNear(pos), 90 + i * 105); }); entity.appendChild(close);
    entity.setAttribute('animation__spawn', 'property: scale; to: 1 1 1; dur: 260; easing: easeOutBack');
    grid.appendChild(entity); cardCount++; updateCount(); flash(pos); if (started && !creatingInitial) tone();
    entity.setAttribute('animation__flow', `property: position; to: ${-pos.x * 1.35} ${pos.y + (Math.random() - .5) * 1.2} ${-pos.z * 1.35}; dur: ${2600 + Math.random() * 2600}; easing: linear`);
    return entity;
  }
  function spawnNear(origin) { const a = Math.atan2(origin.x, origin.z) + (Math.random() - .5) * .36; const r = 4 + Math.random() * 5; makeCard(randomNews(), {x: Math.sin(a)*r, y: .3 + Math.random()*4.8, z: Math.cos(a)*r}); }
  function initialGrid() { creatingInitial = true; for (let row=0; row<6; row++) for (let col=0; col<20; col++) { const angle = col / 20 * Math.PI * 2; const radius = 5.3 + (row % 2) * .9 + (Math.random()-.5)*.35; makeCard(randomNews(), {x: Math.sin(angle)*radius, y: -1.3 + row * 1.04, z: Math.cos(angle)*radius}); } creatingInitial = false; }
  function updateCount() { countEl.textContent = Math.max(0, cardCount) + ' MELDUNGEN'; }
  function rhythm() { const elapsed = (Date.now() - startTime) / 1000; let delay, amount = 1;
    if (elapsed < 1) { phaseEl.textContent = 'STILLE'; sequenceTimer = setTimeout(rhythm, 160); return; }
    if (elapsed < 11) { phaseEl.textContent = 'WELLE 1 · es beginnt langsam'; delay = Math.max(240, 1050 - (elapsed - 1) * 80); }
    else if (elapsed < 13) { phaseEl.textContent = 'KURZE PAUSE'; sequenceTimer = setTimeout(rhythm, 160); return; }
    else if (elapsed < 23) { phaseEl.textContent = 'WELLE 2 · immer mehr'; delay = Math.max(100, 470 - (elapsed - 13) * 34); amount = 1 + Math.floor((elapsed - 13) / 3); }
    else if (elapsed < 30) { phaseEl.textContent = 'ÜBERFLUTUNG'; delay = 150; amount = 3; }
    else { showEscape(); return; }
    for (let i = 0; i < amount; i++) setTimeout(() => spawnNear({x: Math.sin(Math.random()*6.28)*7, y: 1+Math.random()*3, z: Math.cos(Math.random()*6.28)*7}), i * 65);
    sequenceTimer = setTimeout(rhythm, delay);
  }
  function showEscape() {
    if (escapePanel.getAttribute('visible')) return;
    clearTimeout(sequenceTimer); phaseEl.textContent = 'AUSWEG';
    const player = camera.object3D.getWorldPosition(new THREE.Vector3());
    const direction = camera.object3D.getWorldDirection(new THREE.Vector3()).normalize();
    escapePanel.setAttribute('position', {x: player.x + direction.x * 3.1, y: player.y, z: player.z + direction.z * 3.1});
    escapePanel.setAttribute('visible', true);
  }
  document.querySelector('#leave-room').addEventListener('click', () => {
    grid.innerHTML = ''; cardCount = 0; updateCount(); escapePanel.setAttribute('visible', false); phaseEl.textContent = 'RAUM VERLASSEN';
    document.querySelector('#overlay').innerHTML = '<div id="start-panel"><h1>STILLE</h1><p>Du hast den Raum verlassen. Für einen Moment sind keine neuen Nachrichten da.</p><button onclick="location.reload()">NOCH EINMAL BETRETEN</button></div>';
    document.querySelector('#overlay').classList.remove('hidden');
  });
  document.querySelector('#stay-room').addEventListener('click', () => { escapePanel.setAttribute('visible', false); startTime = Date.now() - 13 * 1000; rhythm(); });
  async function loadRSS() { const fetched = await Promise.allSettled(FEEDS.map(async feed => { const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(feed.url); const response = await fetch(proxy, {cache:'no-store'}); if (!response.ok) throw Error('Feed unavailable'); const xml = new DOMParser().parseFromString(await response.text(), 'text/xml'); return [...xml.querySelectorAll('item')].slice(0, 10).map(i => ({source: feed.name, title: i.querySelector('title')?.textContent || '', text: i.querySelector('description')?.textContent.replace(/<[^>]+>/g, '') || ''})); }));
    const live = fetched.filter(x=>x.status==='fulfilled').flatMap(x=>x.value).filter(x=>x.title); if (live.length) news = live; }
  document.querySelector('#start').addEventListener('click', () => { if (started) return; started = true; startTime = Date.now(); document.querySelector('#overlay').classList.add('hidden'); tone(); rhythm(); loadRSS(); });
  </script>
</body>
</html>
