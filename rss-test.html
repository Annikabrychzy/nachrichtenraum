<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSS-X-Test</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;background:#071019;font-family:Arial;color:#fff}#note{position:fixed;z-index:5;top:20px;left:22px;letter-spacing:.1em;font-size:12px;line-height:1.6;pointer-events:none}strong{font-size:18px}button{position:fixed;z-index:6;right:20px;bottom:20px;padding:12px 17px;border:0;background:#e7f9ff;color:#061017;font-weight:bold;cursor:pointer}</style></head>
<body><div id="note"><strong>RSS-KACHEL-TEST</strong><br>Mit Maus oder Controller-Laser auf das große weiße X klicken.</div><button onclick="location.href='index.html'">ZURÜCK</button><a-scene background="color:#071019" renderer="antialias:true; colorManagement:true"><a-entity position="0 1.65 0"><a-camera look-controls><a-entity cursor="rayOrigin:mouse" raycaster="objects:.click-target" position="0 0 -1" geometry="primitive:ring;radiusInner:.01;radiusOuter:.018" material="color:#fff;shader:flat"></a-entity></a-camera><a-entity oculus-touch-controls="hand:left" laser-controls="hand:left" cursor="rayOrigin:entity;fuse:false" raycaster="objects:.click-target" line="color:#bdeeff"></a-entity><a-entity oculus-touch-controls="hand:right" laser-controls="hand:right" cursor="rayOrigin:entity;fuse:false" raycaster="objects:.click-target" line="color:#bdeeff"></a-entity></a-entity><a-light type="ambient" color="#7290a5" intensity=".42"></a-light><a-sky color="#071019"></a-sky><a-plane rotation="-90 0 0" width="80" height="80" color="#14212b"></a-plane><a-entity id="card" position="0 2 -4"><a-plane width="5.9" height="3.45" color="#eaf8ff" material="emissive:#b9e1f2;emissiveIntensity:.4"></a-plane><a-text value="TAGESSCHAU · ARCHIVIERTES RSS" position="-2.52 1.15 .03" width="1.1" color="#39718d"></a-text><a-text value="Politische Nachrichten überfluten den digitalen Raum" position="-2.52 .55 .03" width="2.35" color="#07131b" wrap-count="37"></a-text><a-text value="Dies ist eine Testmeldung. Klicke das große X rechts oben: Die Kachel muss sofort verschwinden." position="-2.52 -.65 .03" width="1.35" color="#385967" wrap-count="48"></a-text><a-entity id="close" class="click-target" position="2.36 1.1 .06"><a-circle class="click-target" radius=".48" color="#10232f"></a-circle><a-plane class="click-target" width=".72" height=".105" position="0 0 .035" rotation="0 0 45" color="#ffffff"></a-plane><a-plane class="click-target" width=".72" height=".105" position="0 0 .04" rotation="0 0 -45" color="#ffffff"></a-plane></a-entity></a-entity><a-entity id="success" visible="false" position="0 2 -4"><a-plane width="5.9" height="2" color="#0c2430" material="emissive:#1f7c8e;emissiveIntensity:.35"></a-plane><a-text value="TEST ERFOLGREICH\nDie RSS-Kachel wurde geschlossen." align="center" position="0 .2 .03" width="2.5" color="#effdff" wrap-count="35"></a-text></a-entity></a-scene><script>document.querySelector('#close').addEventListener('click',e=>{e.stopPropagation();document.querySelector('#card').setAttribute('visible',false);document.querySelector('#success').setAttribute('visible',true);document.querySelector('#note').innerHTML='<strong>ERFOLGREICH</strong><br>Das weiße X wurde erkannt.'})</script></body></html>
