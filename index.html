<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Unendlicher Feed — Nachrichtenraum</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; overflow: hidden; background: #000; color: #effaff; }
    #overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center start; background: radial-gradient(circle at center, #10192188, #000 66%); transition: opacity .8s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #start-panel { width: min(560px, calc(100vw - 48px)); margin-left: clamp(24px, 12vw, 190px); padding: 44px; border: 1px solid #ffffff; background: linear-gradient(135deg, #ffffff 0%, #e9f1f4 100%); color: #05090d; box-shadow: 0 0 70px #ffffff33; text-align: left; }
    h1 { margin: 0 0 9px; letter-spacing: .17em; font-size: clamp(25px, 5vw, 44px); font-weight: 500; }
    p { line-height: 1.55; color: #b8cbd5; }
    button { padding: 14px 26px; border: 1px solid #e5faff; background: #e5faff; color: #061017; font-weight: 700; letter-spacing: .12em; cursor: pointer; }
    #start-panel button { display: block; margin: 25px auto 0; border-color: #05090d; background: #05090d; color: #ffffff; }
    .label { position: fixed; z-index: 8; pointer-events: none; font-size: 10px; letter-spacing: .13em; color: #b9d0db; text-shadow: 0 1px 5px #000; }
    #hud { top: 21px; left: 23px; line-height: 1.7; }
    #archive { display: none; }
    #space { bottom: 21px; left: 23px; z-index: 11; line-height: 1.7; } #signature { bottom: 21px; right: 23px; z-index: 11; text-align: right; }
  </style>
</head>
<body>
  <section id="overlay">
    <div id="start-panel">
      <h1>NACHRICHTENRAUM</h1>
      <button id="start">RAUM BETRETEN</button>
    </div>
  </section>
  <div id="hud" class="label"><strong id="phase"></strong></div>
  <div id="archive" class="label"></div>
  <div id="space" class="label">DIGITALER RAUM</div>
  <div id="signature" class="label">ANNIKABRYCHZY</div>

  <a-scene id="scene" renderer="antialias: true; colorManagement: true" background="color: #020b12" fog="type: exponential; color: #03131c; density: .035" vr-mode-ui="enabled: true" loading-screen="enabled: false">
    <a-entity id="rig" position="0 0 0" smooth-locomotion joystick-turn>
      <a-camera id="camera" look-controls wasd-controls="acceleration: 18">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .click-target" position="0 0 -1" geometry="primitive: ring; radiusInner: .008; radiusOuter: .014" material="color: #e3fbff; shader: flat"></a-entity>
      </a-camera>
      <a-entity id="left-hand" oculus-touch-controls="hand: left" laser-controls="hand: left" cursor="rayOrigin: entity; fuse: false" raycaster="objects: .click-target; far: 20" line="color: #bdeeff; opacity: .65"></a-entity>
      <a-entity id="right-hand" oculus-touch-controls="hand: right" laser-controls="hand: right" cursor="rayOrigin: entity; fuse: false" raycaster="objects: .click-target; far: 20" line="color: #bdeeff; opacity: .65"></a-entity>
    </a-entity>
    <a-light type="ambient" color="#0e5367" intensity="0.22"></a-light>
    <a-light type="hemisphere" color="#14738d" ground-color="#031017" intensity="0.32"></a-light>
    <a-light id="flashlight" type="point" color="#ccefff" intensity="0" distance="10" decay="2" position="0 2 0"></a-light>
    <a-light type="point" color="#00d8ff" intensity="1.3" distance="24" decay="2" position="0 3 -8"></a-light>
    <a-sky color="#020b12"></a-sky>
    <a-plane rotation="-90 0 0" width="180" height="180" color="#031017" material="emissive: #062533; emissiveIntensity: .42; roughness: .6; metalness: .42"></a-plane>
    <a-circle radius="12" rotation="-90 0 0" position="0 .014 0" color="#123a49" material="emissive: #245f72; emissiveIntensity: .38; opacity: .82; transparent: true; roughness: .48; metalness: .3"></a-circle>
    <a-torus radius="12" radius-tubular=".022" rotation="-90 0 0" position="0 .03 0" material="color: #dff9ff; emissive: #a4eaff; emissiveIntensity: .75; opacity: .72; transparent: true"></a-torus>
    <a-entity id="news-grid"></a-entity>
    <a-entity id="starter-card" visible="true" position="0 1.6 -2.3">
      <a-plane width="2.4" height="1.2" color="#ffffff" material="emissive: #b9e8f0; emissiveIntensity: .52; roughness: .5; metalness: .12"></a-plane>
      <a-plane width=".055" height="1.2" position="-1.17 0 .012" color="#65d3ff"></a-plane>
      <a-plane width=".72" height=".19" position="-.76 .42 .025" color="#e5f5f8"></a-plane>
      <a-text value="NEUE MELDUNG" position="-1.06 .365 .04" width=".32" color="#276b82" wrap-count="28"></a-text>
      <a-text value="TAGESSCHAU" position="-.36 .365 .04" width=".42" color="#375160" wrap-count="28"></a-text>
      <a-text value="Aktuelle Meldung: Der Nachrichtenstrom beginnt." position="-1.02 .05 .04" width="1.28" color="#07131b" wrap-count="28"></a-text>
      <a-text value="Diese Kachel kann mit dem X geschlossen werden." position="-1.02 -.37 .04" width=".8" color="#436371" wrap-count="28"></a-text>
      <a-entity id="starter-close" class="click-target" position="1.05 .42 .05">
        <a-plane class="click-target" width=".25" height=".25" color="#0b1b24"></a-plane>
        <a-text value="×" position="0 -.075 .015" align="center" width=".44" color="#ffffff"></a-text>
      </a-entity>
    </a-entity>
    <a-entity id="escape-panel" visible="false" face-player place-in-front>
      <a-plane width="4.7" height="2.15" color="#071016" material="emissive: #112c39; emissiveIntensity: .3"></a-plane>
      <a-text value="Möchtest du den Raum verlassen?" position="0 .47 .03" align="center" width="3.2" color="#f1fbff" wrap-count="32"></a-text>
      <a-text value="Der Nachrichtenstrom wird nicht von allein still." position="0 .06 .03" align="center" width="1.7" color="#9bb9c7" wrap-count="40"></a-text>
      <a-entity id="leave-room" class="click-target" position="-1.08 -.63 .04"><a-plane width="1.62" height=".48" color="#e5faff"></a-plane><a-text value="JA" position="0 -.08 .02" align="center" width=".72" color="#061017"></a-text></a-entity>
      <a-entity id="stay-room" class="click-target" position="1.08 -.63 .04"><a-plane width="1.62" height=".48" color="#19333f"></a-plane><a-text value="NEIN" position="0 -.08 .02" align="center" width=".72" color="#e5faff"></a-text></a-entity>
    </a-entity>
  </a-scene>

  <script>
  /* A complete static WebXR scene: network feeds are optional; the exhibition works offline using FALLBACK_NEWS. */
  const FALLBACK_NEWS = [
    {source:'Tagesschau', title:'Haushaltsdebatte prägt die politische Woche', text:'Im Parlament wird weiter über Prioritäten, Investitionen und soziale Sicherung beraten.'},
    {source:'Tagesschau', title:'Europa sucht nach gemeinsamen Antworten', text:'Bei den Gesprächen stehen Sicherheit, Klima und wirtschaftliche Folgen im Mittelpunkt.'},
    {source:'SPIEGEL', title:'Neue Zahlen lösen politische Diskussionen aus', text:'Regierung und Opposition bewerten die aktuelle Entwicklung sehr unterschiedlich.'},
    {source:'SPIEGEL', title:'Kommunen fordern rasche Entlastung', text:'Städte und Gemeinden warnen vor wachsenden Belastungen in ihren Haushalten.'},
    {source:'taz', title:'Junge Stimmen verlangen mehr Beteiligung', text:'Initiativen diskutieren darüber, wie politische Teilhabe erreichbar bleibt.'},
    {source:'taz', title:'Klimapolitik zwischen Anspruch und Alltag', text:'Neue Entscheidungen treffen auf unterschiedliche Erwartungen in der Gesellschaft.'},
    {source:'Tagesschau', title:'Weitere Verhandlungen bis in die Nacht', text:'Eine Einigung gilt weiter als offen. Der Ticker wird fortlaufend aktualisiert.'},
    {source:'SPIEGEL', title:'Analyse: Was die Entscheidung bedeutet', text:'Die Auswirkungen reichen über die heutige Nachricht hinaus.'},
    {source:'taz', title:'Debatte um Wohnraum wird lauter', text:'Die Frage nach gerechter Verteilung bestimmt viele kommunale Diskussionen.'},
    {source:'BILD', title:'Neue Debatte im politischen Berlin', text:'Positionen prallen aufeinander – die Nachrichtenlage verdichtet sich im Minutentakt.'},
    {source:'n-tv', title:'Regierung berät über nächste Schritte', text:'Aus den Gesprächen kommen fortlaufend neue Einschätzungen und Reaktionen.'},
    {source:'WELT', title:'Europa im Fokus der aktuellen Debatte', text:'Entscheidungen in Politik und Wirtschaft werden aus unterschiedlichen Perspektiven bewertet.'},
    {source:'Presseportal', title:'Verbände reagieren auf politische Pläne', text:'Mitteilungen, Forderungen und Stellungnahmen treffen fast gleichzeitig ein.'},
    {source:'ZDFheute', title:'Aktuelle Lage: Was heute politisch wichtig ist', text:'Neue Entwicklungen werden eingeordnet, während weitere Meldungen folgen.'}
  ];
  const FEEDS = [
    {name:'Tagesschau', url:'https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml'},
    {name:'SPIEGEL', url:'https://www.spiegel.de/politik/index.rss'},
    {name:'taz', url:'https://taz.de/!p4608;rss/'}
  ];
  const grid = document.querySelector('#news-grid');
  const camera = document.querySelector('#camera');
  const light = document.querySelector('#flashlight');
  const starterCard = document.querySelector('#starter-card');
  const phaseEl = document.querySelector('#phase');
  const countEl = document.querySelector('#count');
  const escapePanel = document.querySelector('#escape-panel');
  let news = [...FALLBACK_NEWS], started = false, startTime = 0, cardCount = 0, sequenceTimer, creatingInitial = false, waveCounter = 0, audioContext, escapeShown = false, currentPhase = 'slow', lastStage = '';

  AFRAME.registerComponent('smooth-locomotion', {
    schema: { speed: {default: 2.1} },
    init() { this.direction = new THREE.Vector3(); this.forward = new THREE.Vector3(); this.right = new THREE.Vector3(); },
    tick(_, dt) {
      const hand = document.querySelector('#left-hand');
      const tracked = hand && hand.components['tracked-controls'];
      const gamepad = tracked && tracked.controller && tracked.controller.gamepad;
      const axes = gamepad && gamepad.axes && gamepad.axes.length >= 2 ? gamepad.axes : null;
      if (!axes) return;
      const x = Math.abs(axes[0]) > .14 ? axes[0] : 0;
      const y = Math.abs(axes[1]) > .14 ? axes[1] : 0;
      if (!x && !y) return;
      camera.object3D.getWorldDirection(this.forward); this.forward.y = 0; this.forward.normalize();
      this.right.crossVectors(this.forward, new THREE.Vector3(0, 1, 0)).normalize();
      this.direction.copy(this.forward).multiplyScalar(-y).addScaledVector(this.right, x).normalize();
      this.el.object3D.position.addScaledVector(this.direction, this.data.speed * dt / 1000);
    }
  });
  AFRAME.registerComponent('joystick-turn', {
    schema: { speed: {default: 105} },
    tick(_, dt) {
      const hand = document.querySelector('#right-hand');
      const tracked = hand && hand.components['tracked-controls'];
      const gamepad = tracked && tracked.controller && tracked.controller.gamepad;
      if (!gamepad || !gamepad.axes || gamepad.axes.length < 2) return;
      const x = Math.abs(gamepad.axes[0]) > .16 ? gamepad.axes[0] : 0;
      if (!x) return;
      this.el.object3D.rotation.y -= THREE.MathUtils.degToRad(x * this.data.speed * dt / 1000);
    }
  });
  AFRAME.registerComponent('face-player', {
    tick() { const p = camera.object3D.getWorldPosition(new THREE.Vector3()); p.y = this.el.object3D.position.y; this.el.object3D.lookAt(p); }
  });
  AFRAME.registerComponent('place-in-front', {
    tick() { if (!this.el.getAttribute('visible')) return; const p = camera.object3D.getWorldPosition(new THREE.Vector3()); const d = camera.object3D.getWorldDirection(new THREE.Vector3()).normalize(); const target = new THREE.Vector3(p.x + d.x * 3.1, p.y, p.z + d.z * 3.1); this.el.object3D.position.lerp(target, .12); }
  });
  AFRAME.registerComponent('wave-flight', {
    schema: { from: {type: 'vec3'}, to: {type: 'vec3'}, amplitude: {default: 1.8}, frequency: {default: 1}, duration: {default: 4200} },
    init() { this.startedAt = performance.now(); this.side = new THREE.Vector3(-(this.data.to.z - this.data.from.z), 0, this.data.to.x - this.data.from.x).normalize(); },
    tick(time) { const t = Math.min(1, (time - this.startedAt) / this.data.duration), ease = t * t * (3 - 2 * t); const p = new THREE.Vector3().lerpVectors(this.data.from, this.data.to, ease); const wave = Math.sin(t * Math.PI * this.data.frequency) * this.data.amplitude; p.addScaledVector(this.side, wave); p.y += Math.sin(t * Math.PI * this.data.frequency * 1.4) * this.data.amplitude * .32; this.el.object3D.position.copy(p); if (t === 1 && !this.finished) { this.finished = true; this.el.emit('wave-ended'); } }
  });

  function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function short(s, n) { s = (s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function tone(source = 'neutral') {
    try { const Audio = window.AudioContext || window.webkitAudioContext; audioContext ||= new Audio(); const a = audioContext, g = a.createGain(); const first = a.createOscillator(), second = a.createOscillator(); const notes = {Tagesschau:760, SPIEGEL:680, taz:620, BILD:830, 'n-tv':710, WELT:740, Presseportal:650, ZDFheute:790}; const base = notes[source] || 700; first.type = 'sine'; second.type = 'triangle'; first.frequency.setValueAtTime(base, a.currentTime); second.frequency.setValueAtTime(base * 1.5, a.currentTime + .07); g.gain.setValueAtTime(.038, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .2); first.connect(g); second.connect(g); g.connect(a.destination); first.start(); first.stop(a.currentTime + .1); second.start(a.currentTime + .07); second.stop(a.currentTime + .21); } catch (_) {}
  }
  function entryTone() {
    try { const Audio = window.AudioContext || window.webkitAudioContext; audioContext ||= new Audio(); const a = audioContext, g = a.createGain(); g.gain.setValueAtTime(.045, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .72); g.connect(a.destination); [392,523,659].forEach((frequency, index) => { const o = a.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(frequency, a.currentTime + index * .16); o.connect(g); o.start(a.currentTime + index * .16); o.stop(a.currentTime + index * .16 + .22); }); } catch (_) {}
  }
  function flash(position) { light.setAttribute('position', position); light.setAttribute('intensity', 2.3); setTimeout(() => light.setAttribute('intensity', 0), 120); }
  function sourceColor(source) {
    return source === 'Tagesschau' ? '#65d3ff'
      : source === 'ZDFheute' ? '#347ad1'
      : source === 'BILD' ? '#e5252d'
      : source === 'n-tv' ? '#dc2831'
      : source === 'WELT' ? '#2c8fd0'
      : source === 'Presseportal' ? '#7b56a8'
      : source === 'SPIEGEL' ? '#ff808c'
      : '#f2bd58';
  }
  function randomNews() { return news[Math.floor(Math.random() * news.length)]; }
  function makeCard(item, pos, flight = null) {
    const entity = document.createElement('a-entity');
    entity.setAttribute('position', pos); entity.setAttribute('face-player', ''); entity.setAttribute('scale', '0.01 0.01 0.01');
    const panel = document.createElement('a-plane'); panel.classList.add('click-target'); panel.setAttribute('width', '2.4'); panel.setAttribute('height', '1.2'); panel.setAttribute('color', '#ffffff'); panel.setAttribute('material', 'emissive: #b9e8f0; emissiveIntensity: .52; roughness: .5; metalness: .12'); entity.appendChild(panel);
    const stripe = document.createElement('a-plane'); stripe.setAttribute('width', '.055'); stripe.setAttribute('height', '1.2'); stripe.setAttribute('position', '-1.17 0 .012'); stripe.setAttribute('color', sourceColor(item.source)); entity.appendChild(stripe);
    function label(value, position, width, color, align='left') { const el = document.createElement('a-text'); el.setAttribute('value', value); el.setAttribute('position', position); el.setAttribute('width', width); el.setAttribute('color', color); el.setAttribute('align', align); el.setAttribute('wrap-count', 28); entity.appendChild(el); }
    const badge = document.createElement('a-plane'); badge.setAttribute('width', '.72'); badge.setAttribute('height', '.19'); badge.setAttribute('position', '-.76 .42 .025'); badge.setAttribute('color', '#e5f5f8'); entity.appendChild(badge);
    label('NEUE MELDUNG', '-1.06 .365 .04', .32, '#276b82');
    label(item.source.toUpperCase(), '-.36 .365 .04', .42, '#375160');
    label(short(item.title, 90), '-1.02 .05 .04', 1.28, '#07131b');
    label(short(item.text, 120), '-1.02 -.37 .04', .8, '#436371');
    const close = document.createElement('a-entity'); close.classList.add('click-target'); close.setAttribute('position', '1.05 .42 .05');
    const closeBg = document.createElement('a-plane'); closeBg.classList.add('click-target'); closeBg.setAttribute('width', '.25'); closeBg.setAttribute('height', '.25'); closeBg.setAttribute('color', '#0b1b24'); close.appendChild(closeBg);
    const x = document.createElement('a-text'); x.setAttribute('value', '×'); x.setAttribute('position', '0 -.075 .015'); x.setAttribute('align', 'center'); x.setAttribute('width', '.44'); x.setAttribute('color', '#ffffff'); close.appendChild(x);
    const dismiss = ev => {
      if (ev) ev.stopPropagation();
      if (!entity.parentNode) return;
      entity.remove(); cardCount--; updateCount();
      for (let i=0; i<3; i++) setTimeout(spawnWave, 90 + i * 105);
    };
    close.addEventListener('click', dismiss); close.addEventListener('mousedown', dismiss); entity.appendChild(close);
    const hold = ev => {
      ev.stopPropagation(); if (!entity.parentNode) return;
      if (entity.dataset.pinned === 'true') return;
      entity.dataset.pinned = 'true';
      entity.removeAttribute('wave-flight'); entity.removeAttribute('animation__flow');
      const player = camera.object3D.getWorldPosition(new THREE.Vector3()); const direction = camera.object3D.getWorldDirection(new THREE.Vector3()).normalize();
      const target = {x: player.x + direction.x * 1.55, y: player.y, z: player.z + direction.z * 1.55};
      entity.setAttribute('animation__hold', `property: position; to: ${target.x} ${target.y} ${target.z}; dur: 320; easing: easeOutQuad`);
      entity.setAttribute('animation__enlarge', 'property: scale; to: 2.15 2.15 2.15; dur: 320; easing: easeOutQuad');
      if (!entity.querySelector('.pinned-label')) { const pinned = document.createElement('a-text'); pinned.classList.add('pinned-label'); pinned.setAttribute('value', 'ANGEHEFTET'); pinned.setAttribute('position', '-.68 .54 .05'); pinned.setAttribute('width', '.38'); pinned.setAttribute('color', '#b97800'); entity.appendChild(pinned); }
    };
    panel.addEventListener('click', hold); panel.addEventListener('mousedown', hold);
    entity.setAttribute('animation__spawn', 'property: scale; to: 1 1 1; dur: 260; easing: easeOutBack');
    grid.appendChild(entity); cardCount++; updateCount(); flash(pos); if (started && !creatingInitial) tone(item.source);
    setTimeout(() => document.querySelectorAll('[raycaster]').forEach(ray => ray.components.raycaster?.refreshObjects()), 0);
    if (flight) entity.setAttribute('wave-flight', flight);
    else entity.setAttribute('animation__flow', `property: position; to: ${-pos.x * 1.35} ${pos.y + (Math.random() - .5) * 1.2} ${-pos.z * 1.35}; dur: ${2600 + Math.random() * 2600}; easing: linear`);
    entity.addEventListener('wave-ended', () => { if (entity.parentNode) { entity.remove(); cardCount--; updateCount(); } });
    return entity;
  }
  function spawnWave(item = randomNews(), directlyInFront = false) {
    const index = waveCounter++, front = directlyInFront || index === 0;
    const angle = front ? Math.PI : Math.random() * Math.PI * 2;
    const radius = front ? 3.8 : 7 + Math.random() * 3.5;
    const from = {x: Math.sin(angle) * radius, y: front ? 1.65 : .4 + Math.random() * 4.4, z: Math.cos(angle) * radius};
    const exitAngle = angle + Math.PI + (Math.random() - .5) * 1.2;
    const to = {x: Math.sin(exitAngle) * radius * 1.25, y: from.y + (front ? .18 : (Math.random() - .5) * 1.8), z: Math.cos(exitAngle) * radius * 1.25};
    const profile = currentPhase === 'slow' ? {amplitude:.7, frequency:1, duration:11000} : currentPhase === 'fast' ? {amplitude:1.4, frequency:2, duration:4300} : {amplitude:2.5, frequency:3, duration:1700};
    makeCard(item, from, {...profile, duration: profile.duration + Math.random() * (currentPhase === 'slow' ? 1200 : 1000)});
  }
  function spawnNear() { spawnWave(); }
  function initialGrid() { creatingInitial = true; for (let row=0; row<6; row++) for (let col=0; col<20; col++) { const angle = col / 20 * Math.PI * 2; const radius = 5.3 + (row % 2) * .9 + (Math.random()-.5)*.35; makeCard(randomNews(), {x: Math.sin(angle)*radius, y: -1.3 + row * 1.04, z: Math.cos(angle)*radius}); } creatingInitial = false; }
  function updateCount() { if (countEl) countEl.textContent = Math.max(0, cardCount) + ' MELDUNGEN'; }
  function clearNews() { grid.innerHTML = ''; starterCard.setAttribute('visible', false); cardCount = 0; updateCount(); }
  function rhythm() { const elapsed = (Date.now() - startTime) / 1000; let delay, amount, stage;
    if (elapsed < 10) { stage = 'slow'; phaseEl.textContent = 'MORGEN · 07:00'; delay = 1150; amount = 1; }
    else if (elapsed < 12) { stage = 'pause-one'; phaseEl.textContent = 'PAUSE'; delay = 180; amount = 0; }
    else if (elapsed < 22) { stage = 'fast'; phaseEl.textContent = 'SCHNELLE ÜBERFLUTUNG'; delay = Math.max(240, 980 - (elapsed - 12) * 68); amount = 1; }
    else if (elapsed < 24) { stage = 'pause-two'; phaseEl.textContent = 'PAUSE'; delay = 180; amount = 0; }
    else if (elapsed < 34) { stage = 'overload'; phaseEl.textContent = 'ÜBERTRIEBENE ÜBERFLUTUNG'; delay = 105; amount = 4; }
    else { showEscape(); return; }
    if (stage !== lastStage) { if (stage.startsWith('pause')) clearNews(); lastStage = stage; }
    currentPhase = stage === 'slow' ? 'slow' : stage === 'fast' ? 'fast' : 'overload';
    for (let i = 0; i < amount; i++) setTimeout(spawnWave, i * 65);
    sequenceTimer = setTimeout(rhythm, delay);
  }
  function showEscape() {
    if (escapePanel.getAttribute('visible')) return;
    clearTimeout(sequenceTimer); escapeShown = true; phaseEl.textContent = 'AUSWEG';
    const player = camera.object3D.getWorldPosition(new THREE.Vector3());
    const direction = camera.object3D.getWorldDirection(new THREE.Vector3()).normalize();
    escapePanel.setAttribute('position', {x: player.x + direction.x * 3.1, y: player.y, z: player.z + direction.z * 3.1});
    escapePanel.setAttribute('visible', true);
  }
  document.querySelector('#leave-room').addEventListener('click', () => {
    location.href = 'exit-destination.html';
  });
  document.querySelector('#stay-room').addEventListener('click', () => { escapePanel.setAttribute('visible', false); rhythm(); });
  const closeStarter = event => {
    event.stopPropagation(); starterCard.setAttribute('visible', false);
    for (let i = 0; i < 3; i++) setTimeout(spawnWave, 80 + i * 120);
  };
  document.querySelector('#starter-close').addEventListener('click', closeStarter);
  document.querySelector('#starter-close').addEventListener('mousedown', closeStarter);
  async function fetchRSS(feed) {
    const routes = [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(feed.url),
      'https://corsproxy.io/?url=' + encodeURIComponent(feed.url)
    ];
    for (const route of routes) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);
      try {
        const response = await fetch(route, {cache:'no-store', signal: controller.signal});
        if (!response.ok) continue;
        const xml = new DOMParser().parseFromString(await response.text(), 'text/xml');
        const items = [...xml.querySelectorAll('item')].slice(0, 10).map(i => ({
          source: feed.name,
          title: i.querySelector('title')?.textContent || '',
          text: i.querySelector('description')?.textContent.replace(/<[^>]+>/g, '') || ''
        })).filter(item => item.title);
        if (items.length) return items;
      } catch (_) {
        // A proxy can be temporarily unavailable; the second route is tried next.
      } finally { clearTimeout(timeout); }
    }
    return [];
  }
  async function loadRSS() {
    const live = (await Promise.all(FEEDS.map(fetchRSS))).flat();
    // The room remains active even if a publisher or proxy blocks a feed.
    if (live.length) news = [...live, ...FALLBACK_NEWS];
  }
  document.querySelector('#start').addEventListener('click', () => {
    if (started) return;
    started = true; document.querySelector('#overlay').classList.add('hidden'); entryTone(); loadRSS();
    setTimeout(() => { startTime = Date.now(); starterCard.setAttribute('visible', true); tone('Tagesschau'); setTimeout(rhythm, 1150); }, 2000);
  });
  </script>
</body>
